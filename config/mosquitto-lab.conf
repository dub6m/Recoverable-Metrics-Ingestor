# Mosquitto configuration for the lab. Tests and the demo copy this file,
# replace the listener line with a private port and add persistence_location.

# Local only. The lab broker is never exposed beyond this machine.
listener 1883 127.0.0.1
allow_anonymous true

# Persistent sessions (the collector's) keep QoS 1 messages while the client
# is disconnected, up to this many. Beyond that the broker drops them.
max_queued_messages 1000

# Saved to disk on every change. Without this, a broker restart forgets the
# collector's session and subscription, and readings the gateway sends before
# the collector re-subscribes are lost (found in T4; see artifacts/t4/).
# A broker crash can still lose messages it had accepted but not yet saved
# or delivered.
persistence true
autosave_interval 1
autosave_on_changes true

# Telemetry is never retained, so a new subscriber never sees stale state.
retain_available false
